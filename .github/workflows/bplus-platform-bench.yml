name: B+ Range Benchmark
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bplus-platform-bench.yml'
permissions:
  contents: read
jobs:
  timed-range:
    name: B+ range (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Build and time both revisions
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          from itertools import product
          from pathlib import Path
          import csv
          import io
          import os
          import platform
          import shutil
          import subprocess
          import tempfile

          def run(command, **kwargs):
              print(command, flush=True)
              subprocess.run(command, check=True, **kwargs)

          print(platform.platform(), platform.machine(), flush=True)
          run(["rustc", "+1.95.0", "-vV"])
          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary)
              work = root / "source"
              target = root / "target"
              exe = "bplus_range.exe" if os.name == "nt" else "bplus_range"
              run(["git", "worktree", "add", "--detach", str(work), os.environ["BASE_SHA"]])
              try:
                  binaries = {}
                  for label, rev in (("base", os.environ["BASE_SHA"]), ("candidate", os.environ["HEAD_SHA"])):
                      run(["git", "checkout", "--detach", rev], cwd=work)
                      run(["cargo", "+1.95.0", "build", "--locked", "--release",
                           "--manifest-path", "tools/throughput-analysis/Cargo.toml",
                           "--features", "bplus-bench", "--bin", "bplus_range",
                           "--target-dir", str(target)], cwd=work)
                      binaries[label] = shutil.copy2(target / "release" / exe, root / (label + "-" + exe))
                  print("version,seed,fanout,height,items_per_range,impl,seconds,ranges,items,checksum", flush=True)
                  for seed, width in product((1, 2, 3), ("8", "16", "32")):
                      order = ("base", "candidate") if seed != 2 else ("candidate", "base")
                      for label in order:
                          for attempt in range(4):
                              child = subprocess.run([binaries[label], str(seed), width],
                                                     capture_output=True, text=True, timeout=65)
                              rows = list(csv.DictReader(io.StringIO(child.stdout)))
                              if child.returncode == 0 and len(rows) == 12:
                                  break
                              print(child.stderr, flush=True)
                          else:
                              raise RuntimeError((seed, width, label))
                          for row in rows:
                              print(label + "," + ",".join(row.values()), flush=True)
              finally:
                  run(["git", "worktree", "remove", str(work)])
          PY
