name: B+ Streaming Lookup Benchmark
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bplus-point-platform-bench.yml'
permissions:
  contents: read
jobs:
  timed-point:
    name: B+ lookup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Build and time both revisions
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          from itertools import product
          from pathlib import Path
          import csv
          import io
          import os
          import platform
          import shutil
          import subprocess
          import tempfile

          def run(command, **kwargs):
              print(command, flush=True)
              subprocess.run(command, check=True, **kwargs)

          def benchmark_driver(original):
              text = original.decode("utf-8").replace("\r\n", "\n")
              first = text.index('        ("brie", &|q| {')
              last = text.index('        ("std",', first)
              text = text[:last] + text[first:last].replace('"brie"', '"brie_control"', 1) + text[last:]
              text = text.replace(
                  "    let pages = make_pages::<usize>(fanout, height);",
                  '    if std::env::var("BPLUS_FANOUT").unwrap().parse::<usize>().unwrap() != fanout { return Ok(()); }\n'
                  "    let pages = make_pages::<usize>(fanout, height);")
              text = text.replace("            for &(_, method) in methods {",
                  '            for &(name, method) in methods {\n                if !matches!(name, "brie" | "brie_control" | "jzap") { continue; }')
              text = text.replace("            (pilot as f64 * 1.5 / fastest).ceil() as usize",
                  '            let target: f64 = std::env::var("BPLUS_TARGET_SECONDS").unwrap().parse().unwrap();\n'
                  "            (pilot as f64 * target / fastest).ceil() as usize")
              text = text.replace("            let (elapsed, sum) = measure(method, &queries, batches)?;",
                  '            if !matches!(name, "brie" | "brie_control" | "jzap") { continue; }\n'
                  "            let (elapsed, sum) = measure(method, &queries, batches)?;")
              assert text.count('if !matches!(name, "brie" | "brie_control" | "jzap")') == 2
              return text

          print(platform.platform(), platform.machine(), flush=True)
          run(["rustc", "+1.95.0", "-vV"])
          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary)
              work = root / "source"
              target = root / "target"
              exe = "bplus.exe" if os.name == "nt" else "bplus"
              run(["git", "worktree", "add", "--detach", str(work), os.environ["BASE_SHA"]])
              try:
                  binaries = {}
                  for label, rev in (("base", os.environ["BASE_SHA"]), ("candidate", os.environ["HEAD_SHA"])):
                      run(["git", "checkout", "--detach", rev], cwd=work)
                      driver = work / "tools/throughput-analysis/src/bin/bplus.rs"
                      original = driver.read_bytes()
                      try:
                          driver.write_text(benchmark_driver(original), encoding="utf-8")
                          run(["cargo", "+1.95.0", "build", "--locked", "--release",
                           "--manifest-path", "tools/throughput-analysis/Cargo.toml",
                           "--features", "bplus-bench", "--bin", "bplus",
                               "--target-dir", str(target)], cwd=work)
                      finally:
                          driver.write_bytes(original)
                      binaries[label] = shutil.copy2(target / "release" / exe, root / (label + "-" + exe))
                  print("version,seed,fanout,height,implementation,seconds,operations,checksum", flush=True)
                  for seed, width in product((1, 2, 3), ("8", "16", "32")):
                      order = ("base", "candidate") if seed != 2 else ("candidate", "base")
                      for label in order:
                          for attempt in range(4):
                              child = subprocess.run([binaries[label], str(seed)],
                                                     capture_output=True, text=True, timeout=90,
                                                     env=os.environ | {"BPLUS_TARGET_SECONDS": str(1.45 + 0.35 * attempt), "BPLUS_FANOUT": width})
                              rows = list(csv.DictReader(io.StringIO(child.stdout)))
                              if child.returncode == 0 and len(rows) == 3:
                                  break
                              print(child.stderr, flush=True)
                          else:
                              raise RuntimeError((seed, width, label))
                          for row in rows:
                              print(label + "," + ",".join(row.values()), flush=True)
              finally:
                  run(["git", "worktree", "remove", str(work)])
          PY
