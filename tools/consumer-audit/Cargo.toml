[package]
name = "jzap-consumer-audit"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[lib]
crate-type = ["staticlib"]
[dependencies]
jzap-std = { path = "../.." }
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"
debug = 1
