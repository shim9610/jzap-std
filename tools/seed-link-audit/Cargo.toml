[package]
name = "jzap-seed-link-audit"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
jzap-std = { path = "../..", features = ["std"] }
[features]
# Deliberate defects reached from the root; each must be reported.
panic-control = []
alloc-control = []
std-file-control = []
[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"
debug = 1
[profile.dev]
panic = "abort"
