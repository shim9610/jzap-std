[package]
name = "jzap-throughput-analysis"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
jzap-std = { path = "../.." }
brie-tree = { version = "=0.1.2", optional = true }

[[bin]]
name = "bplus"
required-features = ["bplus-bench"]

[features]
deque-borrowed-consume = []
deque-outline-action = []
string-memory = []
shared-memory = []
owned-budgets = []
btree-memory = []
bplus-bench = ["dep:brie-tree"]
bplus-memory = ["bplus-bench"]
bplus-pool = ["bplus-bench"]
hash-map = ["jzap-std/std"]
hash-set = ["jzap-std/std"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"
